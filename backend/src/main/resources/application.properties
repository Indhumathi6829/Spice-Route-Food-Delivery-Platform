# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── DataSource ───────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/spiceroute?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:spiceroute}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Cache (simple in-memory) ─────────────────────────────────────────────────
spring.cache.type=simple

# ── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:spiceroute-super-secret-key-change-in-production-2024}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# ── Razorpay ─────────────────────────────────────────────────────────────────
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}

# ── Cloudinary ───────────────────────────────────────────────────────────────
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:spiceroute}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:placeholder}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:placeholder}

# ── Mail ─────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@spiceroute.com}
spring.mail.password=${MAIL_PASSWORD:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Springdoc / Swagger ──────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.spiceroute=DEBUG
logging.level.org.springframework.security=INFO

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# ── File Upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ── Google Maps ───────────────────────────────────────────────────────────────
app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:your_google_maps_api_key}

# ── Firebase FCM ─────────────────────────────────────────────────────────────
# Path to firebase-service-account.json (relative to classpath or absolute)
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
app.firebase.enabled=${FIREBASE_ENABLED:false}

# ── Auth ─────────────────────────────────────────────────────────────────────
# Admin registration requires this code — set a strong value in production.
# Leave as __DISABLED__ to prevent all public admin registration.
app.auth.admin-registration-code=${ADMIN_REGISTRATION_CODE:__DISABLED__}
app.delivery.initial-radius-km=${DELIVERY_INITIAL_RADIUS_KM:3.0}
app.delivery.max-radius-km=${DELIVERY_MAX_RADIUS_KM:10.0}
app.delivery.radius-step-km=${DELIVERY_RADIUS_STEP_KM:2.0}
app.delivery.assignment-timeout-seconds=${DELIVERY_ASSIGNMENT_TIMEOUT_SECONDS:60}
app.delivery.max-assignment-attempts=${DELIVERY_MAX_ATTEMPTS:5}

# ── Scheduling ────────────────────────────────────────────────────────────────
spring.task.scheduling.pool.size=4

# ── SMS (optional — app continues working via Firebase if disabled) ───────────
app.sms.enabled=${SMS_ENABLED:false}
app.sms.provider=${SMS_PROVIDER:noop}
app.sms.api-key=${SMS_API_KEY:}
app.sms.api-secret=${SMS_API_SECRET:}
app.sms.from=${SMS_FROM:SpiceRt}

# ── AI Revenue Recovery ───────────────────────────────────────────────────────
# OpenAI key for LLM explanations. If blank/missing the recovery agent still
# works — AI explanations will fall back to rule-based text.
app.ai.openai.api-key=${AI_API_KEY:}
app.ai.openai.model=${AI_MODEL:gpt-4o-mini}
app.ai.openai.enabled=${AI_ENABLED:false}
# Max recovery attempts per order before graceful stop
app.recovery.max-attempts=${RECOVERY_MAX_ATTEMPTS:3}
# Hours after which an unresolved recovery attempt is marked EXPIRED
app.recovery.expiry-hours=${RECOVERY_EXPIRY_HOURS:24}
