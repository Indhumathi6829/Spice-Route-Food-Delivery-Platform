# Test configuration — uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:spiceroute_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.cache.type=none

app.jwt.secret=test-jwt-secret-key-minimum-32-characters-long
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

app.razorpay.key-id=rzp_test_placeholder
app.razorpay.key-secret=placeholder_secret

spring.mail.host=localhost
spring.mail.port=3025

logging.level.com.spiceroute=WARN
logging.level.org.springframework.security=WARN
