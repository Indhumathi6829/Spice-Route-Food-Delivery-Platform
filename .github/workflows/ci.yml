name: CI — SpiceRoute Kitchen

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: spiceroute
          MYSQL_DATABASE: spiceroute_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:spiceroute_test
          JWT_SECRET: test-jwt-secret-key-for-ci-pipeline-use-only

      - name: Build JAR
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spiceroute-backend
          path: backend/target/*.jar
          retention-days: 7

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20 + Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: spiceroute-frontend
          path: frontend/dist/
          retention-days: 7

  # ── Docker build check ───────────────────────────────────────────────────────
  docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config --quiet

      - name: Build images (no push)
        run: docker compose build
        env:
          MYSQL_ROOT_PASSWORD: spiceroute
          JWT_SECRET: test-jwt-secret-key-for-ci-pipeline-use-only
